name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number to stamp on the archive (defaults to the run number)"
        required: false
        type: string
      skip_tests:
        description: "Skip the test gate (not recommended)"
        required: false
        default: false
        type: boolean

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the required secrets exist
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${APPLE_TEAM_ID:-}" ] || missing+=("APPLE_TEAM_ID")
          [ -n "${APP_STORE_CONNECT_KEY_ID:-}" ] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] || missing+=("APP_STORE_CONNECT_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All four App Store Connect secrets are present."

      - name: Select Xcode
        run: |
          set -euo pipefail
          chosen=""
          for candidate in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) \
                           $(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V -r) \
                           /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then chosen="$candidate"; break; fi
          done
          [ -n "$chosen" ] || { echo "::error::No Xcode installation found"; exit 1; }
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      - name: Install the App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          # The secret holds the .p8 contents. Nothing is echoed.
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          if ! grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8 private key."
            exit 1
          fi
          echo "API key installed."

      # What can this key actually do? "Cloud signing permission error" from
      # exportArchive is Apple refusing to create signing assets, and the only
      # way to tell a role problem from a missing asset is to ask. Prints
      # counts and error codes only — never any part of the key.
      - name: Check what the App Store Connect key is allowed to do
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, collections, json, os, subprocess, time, urllib.error, urllib.request

          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"]
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          key_path = os.path.expanduser("~/private_keys/AuthKey_%s.p8" % key_id)

          def b64(raw: bytes) -> str:
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          now = int(time.time())
          header = b64(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
          payload = b64(json.dumps({
              "iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1",
          }).encode())
          signing_input = ("%s.%s" % (header, payload)).encode()

          der = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path],
              input=signing_input, capture_output=True, check=True,
          ).stdout

          # ES256 wants the raw r||s pair; openssl emits DER SEQUENCE{INTEGER,INTEGER}.
          def take_integer(buf, at):
              assert buf[at] == 0x02, "expected an INTEGER"
              size = buf[at + 1]
              value = buf[at + 2: at + 2 + size]
              return value.lstrip(b"\x00").rjust(32, b"\x00"), at + 2 + size

          assert der[0] == 0x30, "expected a SEQUENCE"
          start = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7F)
          r, after_r = take_integer(der, start)
          s, _ = take_integer(der, after_r)
          token = "%s.%s.%s" % (header, payload, b64(r + s))

          def fetch(path):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": "Bearer " + token},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  raw = error.read() or b"{}"
                  try:
                      return error.code, json.loads(raw)
                  except ValueError:
                      return error.code, {}

          for label, path, field in (
              ("certificates", "/v1/certificates?limit=200", "certificateType"),
              ("profiles", "/v1/profiles?limit=200", "profileType"),
              ("devices", "/v1/devices?limit=200", "deviceClass"),
              ("bundle IDs", "/v1/bundleIds?limit=200", "identifier"),
          ):
              status, body = fetch(path)
              print("--- %s: HTTP %s" % (label, status))
              if status != 200:
                  for problem in body.get("errors", []):
                      print("      %s | %s | %s" % (
                          problem.get("code"), problem.get("title"), problem.get("detail")))
                  continue
              counts = collections.Counter(
                  entry.get("attributes", {}).get(field) for entry in body.get("data", []))
              print("      %s" % (dict(counts) or "none"))
          PY

      - name: Test gate on an iPad simulator
        if: ${{ inputs.skip_tests != true }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re
          data = json.load(open("/tmp/devices.json"))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              version = re.findall(r"iOS-(\d+)-(\d+)", runtime)
              order = tuple(int(part) for part in version[0]) if version else (0, 0)
              for device in devices:
                  if device.get("isAvailable") and "iPad" in device["name"]:
                      rank = 3 if "iPad Pro" in device["name"] else 2 if "iPad Air" in device["name"] else 1
                      candidates.append((rank, order, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("::error::No iPad simulator is available")
          candidates.sort(reverse=True)
          print(f"SIMULATOR_UDID={candidates[0][3]}")
          PY
          set -o pipefail
          xcodebuild test \
            -project Holograph.xcodeproj \
            -scheme Holograph \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            -derivedDataPath build

      - name: Write export options
        run: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint /tmp/ExportOptions.plist

      # Archived unsigned, on purpose. `xcodebuild archive` with automatic
      # signing always provisions for *development* and rejects any other
      # identity as a manual conflict — and a development profile is built from
      # registered device UDIDs, which a team shipping only through TestFlight
      # has none of. Distribution signing belongs to -exportArchive, which
      # re-signs the app with the App Store profile it provisions itself.
      - name: Archive
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          [ -n "$BUILD_NUMBER" ] || BUILD_NUMBER="${{ github.run_number }}"
          echo "Archiving build $BUILD_NUMBER"
          set -o pipefail
          xcodebuild archive \
            -project Holograph.xcodeproj \
            -scheme Holograph \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath /tmp/Holograph.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Report the signing identities available to the runner
        if: failure()
        run: |
          # Names only — no key material. Useful when automatic provisioning
          # cannot resolve a distribution identity.
          echo "Signing identities visible to this runner:"
          security find-identity -v -p codesigning || true

      - name: Export the IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath /tmp/Holograph.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          ls -la /tmp/export

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA="$(ls /tmp/export/*.ipa | head -1)"
          echo "Uploading $(basename "$IPA")"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload the archive for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: /tmp/export
          retention-days: 5
          if-no-files-found: ignore
