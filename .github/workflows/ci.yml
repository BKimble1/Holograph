name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  project-integrity:
    name: Project integrity (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift lexical sanity check
        run: python3 Scripts/swift_sanity_check.py

      - name: Validate project.pbxproj
        run: python3 Scripts/validate_pbxproj.py

      - name: Xcode project is up to date with the source tree
        run: |
          python3 Scripts/generate_xcodeproj.py
          if ! git diff --quiet -- Holograph.xcodeproj; then
            echo "::error::Holograph.xcodeproj is stale. Run 'python3 Scripts/generate_xcodeproj.py' and commit the result."
            git --no-pager diff -- Holograph.xcodeproj
            exit 1
          fi

      - name: Asset catalog and Info.plist are well formed
        run: |
          python3 - <<'PY'
          import json, plistlib, pathlib, sys
          problems = []
          for path in pathlib.Path("Holograph/Resources").rglob("Contents.json"):
              try:
                  json.loads(path.read_text())
              except Exception as error:
                  problems.append(f"{path}: {error}")
          try:
              info = plistlib.loads(pathlib.Path("Holograph/Info.plist").read_bytes())
          except Exception as error:
              problems.append(f"Info.plist: {error}")
              info = {}
          icon = pathlib.Path("Holograph/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          if not icon.exists():
              problems.append("the 1024x1024 app icon is missing")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print("assets OK; bundle id key:", info.get("CFBundleIdentifier"))
          PY

  build-and-test:
    name: Build and test on an iPad simulator
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          chosen=""
          for candidate in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) \
                           $(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V -r) \
                           /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then chosen="$candidate"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No Xcode installation found on this runner"; exit 1
          fi
          echo "Using $chosen"
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          swift --version

      - name: Choose an available iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re
          data = json.load(open("/tmp/devices.json"))
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              version = re.findall(r"iOS-(\d+)-(\d+)", runtime)
              order = tuple(int(part) for part in version[0]) if version else (0, 0)
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device["name"]
                  if "iPad" not in name:
                      continue
                  # Prefer the largest modern iPad Pro, then any iPad Pro/Air.
                  rank = 0
                  if "iPad Pro" in name:
                      rank = 3
                  elif "iPad Air" in name:
                      rank = 2
                  elif "iPad (" in name or name == "iPad":
                      rank = 1
                  candidates.append((rank, order, name, device["udid"]))
          if not candidates:
              raise SystemExit("::error::No iPad simulator is available on this runner")
          candidates.sort(reverse=True)
          rank, order, name, udid = candidates[0]
          print(f"SIMULATOR_UDID={udid}")
          print(f"SIMULATOR_NAME={name}")
          PY
          echo "Selected simulator: $(grep SIMULATOR_NAME "$GITHUB_ENV" | tail -1)"

      - name: Boot the simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcrun simctl boot "${SIMULATOR_UDID}" || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          xcrun simctl list devices | grep -i booted || true

      - name: Build for testing
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Holograph.xcodeproj \
            -scheme Holograph \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            -derivedDataPath build \
            | tee build.log

      - name: Report compiler warnings
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Compiler warnings" >> "$GITHUB_STEP_SUMMARY"
            grep -E "warning:" build.log | sort -u | head -50 >> "$GITHUB_STEP_SUMMARY" || echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke-launch the app
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          APP="build/Build/Products/Debug-iphonesimulator/Holograph.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP was not produced by the build"
            exit 1
          fi
          echo "--- bundle contents ---"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | head -60

          xcrun simctl install "${SIMULATOR_UDID}" "$APP" || {
            echo "::error::simctl install failed"; exit 1;
          }

          echo "--- confirming the executable is not a preview stub ---"
          file "$APP/Holograph"
          ls "$APP" | grep -i dylib && echo "::warning::the bundle carries dylibs" || echo "no dylibs in the bundle"

          echo "--- launching, streaming the app's own output ---"
          # macOS has no coreutils `timeout`; run the stream in the background
          # and reap it. A plain launch shows a crash directly, instead of it
          # being reported only as "crashed before establishing connection".
          xcrun simctl launch --console-pty --terminate-running-process \
            "${SIMULATOR_UDID}" com.idlery.holograph \
            -seedDemoApps -inMemoryStore &
          stream=$!
          sleep 25
          kill "$stream" 2>/dev/null

          echo "--- did it stay up? ---"
          if xcrun simctl spawn "${SIMULATOR_UDID}" launchctl list 2>/dev/null | grep -qi holograph; then
            echo "app is running"
          else
            echo "::warning::app is NOT running 25s after launch"
          fi

          echo "--- crash reports in the last 15 minutes ---"
          python3 Scripts/dump_crash_reports.py 15 || true
          exit 0

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Holograph.xcodeproj \
            -scheme Holograph \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            -derivedDataPath build \
            -only-testing:HolographTests \
            -resultBundlePath UnitTests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 180 \
            | tee unit-tests.log

      - name: Run UI tests
        id: ui-tests
        continue-on-error: true
        if: always()
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Holograph.xcodeproj \
            -scheme Holograph \
            -configuration Debug \
            -destination "id=${SIMULATOR_UDID}" \
            -derivedDataPath build \
            -only-testing:HolographUITests \
            -resultBundlePath UITests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            | tee ui-tests.log

      - name: Diagnose any crash
        if: always()
        run: |
          set +e
          echo "### Crash diagnostics" >> "$GITHUB_STEP_SUMMARY"

          for bundle in UnitTests.xcresult UITests.xcresult; do
            [ -d "$bundle" ] || continue
            echo "--- $bundle test summary ---"
            xcrun xcresulttool get test-results summary --path "$bundle" 2>/dev/null | head -60
            echo "--- $bundle failures ---"
            xcrun xcresulttool get test-results tests --path "$bundle" 2>/dev/null \
              | grep -iE '"(name|result|failureText|message)"' | head -80
          done

          echo "--- simulator crash reports from this run ---"
          python3 Scripts/dump_crash_reports.py 45 || true
          exit 0

      - name: Export screenshots from the UI test results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p screenshots
          if [ ! -d UITests.xcresult ]; then
            echo "No UI test result bundle to export from."
            exit 0
          fi
          if xcrun xcresulttool export attachments \
               --path UITests.xcresult \
               --output-path screenshots >/dev/null 2>&1; then
            echo "Exported attachments with xcresulttool."
          else
            echo "::warning::xcresulttool could not export attachments on this Xcode."
          fi
          # xcresulttool writes a manifest plus opaque filenames; give the images
          # their attachment names so they are readable in the artifact.
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root = pathlib.Path("screenshots")
          keep = root / "named"
          keep.mkdir(exist_ok=True)
          manifest = root / "manifest.json"
          if not manifest.exists():
              print("no manifest.json; nothing to rename")
              raise SystemExit(0)
          # Only this project's own captures, which are all numbered "NN-name".
          wanted = re.compile(r"\d{2}-[a-z0-9-]+")
          count = 0
          entries = json.loads(manifest.read_text())
          print("manifest keys:", sorted({k for e in entries for k in e}))
          # Show one entry verbatim so a naming mismatch is visible rather than
          # silently producing nothing.
          if entries:
              print("first entry:", json.dumps(entries[0])[:1200])
          for test in entries:
              for attachment in test.get("attachments", []):
                  exported = attachment.get("exportedFileName")
                  if not exported:
                      continue
                  # xcresulttool has used more than one key for the name over
                  # the years; try each, then the exported filename itself.
                  for candidate in (
                      attachment.get("suggestedHumanReadableName") or "",
                      attachment.get("name") or "",
                      exported,
                  ):
                      match = wanted.search(candidate)
                      if match:
                          break
                  if not match:
                      continue
                  source = root / exported
                  if source.exists():
                      shutil.copy(source, keep / f"{match.group(0)}.png")
                      count += 1
          print(f"kept {count} project screenshots")
          # XCTest's own recordings have quotes in their names, which artifact
          # upload rejects outright — drop everything except what we kept.
          for path in root.iterdir():
              if path != keep:
                  shutil.rmtree(path) if path.is_dir() else path.unlink()
          for path in keep.iterdir():
              shutil.move(str(path), root / path.name)
          keep.rmdir()
          PY
          ls -la screenshots || true

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "no screenshots to publish"
            exit 0
          fi
          # Artifact downloads are not reachable from every environment, so the
          # images also land on a branch anyone can simply fetch.
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$work/screenshots"
          cp screenshots/*.png "$work/screenshots/"
          {
            echo "# Holograph — CI screenshots"
            echo
            echo "Captured from commit ${GITHUB_SHA} on ${SIMULATOR_NAME}."
            echo
            for shot in "$work"/screenshots/*.png; do
              echo "- $(basename "$shot")"
            done
          } > "$work/README.md"
          git -C "$work" add -A
          git -C "$work" commit -q -m "CI screenshots from ${GITHUB_SHA}"
          git -C "$work" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/ci-screenshots
          echo "published to ci-screenshots"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if either suite failed
        if: always()
        run: |
          unit="${{ steps.unit-tests.outcome }}"
          ui="${{ steps.ui-tests.outcome }}"
          echo "unit tests: $unit"
          echo "ui tests:   $ui"
          if [ "$unit" != "success" ] || [ "$ui" != "success" ]; then
            echo "::error::Tests failed (unit: $unit, ui: $ui)"
            exit 1
          fi

      - name: Upload logs and result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build.log
            unit-tests.log
            ui-tests.log
            UnitTests.xcresult
            UITests.xcresult
          retention-days: 7
          if-no-files-found: ignore
