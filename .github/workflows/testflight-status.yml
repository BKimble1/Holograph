name: TestFlight status

# Reads back where each uploaded build has got to in Apple's processing.
# Nothing is built, so this is quick and safe to run whenever.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier to report on"
        required: false
        default: "com.idlery.holograph"
        type: string

jobs:
  status:
    name: Report TestFlight processing status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Report build status
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private_keys"
          key="${RUNNER_TEMP}/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Written to sign with, never echoed, removed on the way out.
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -rf "${RUNNER_TEMP}/private_keys"' EXIT
          ASC_KEY_PATH="$key" python3 Scripts/asc_build_status.py "${{ inputs.bundle_id }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
